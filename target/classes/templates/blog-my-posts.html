<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>My Posts - Clean Blog</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800" rel="stylesheet" type="text/css" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body>
    <!-- Navigation-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!-- Page Header-->
    <header class="masthead" style="background-image: url('https://images.unsplash.com/photo-1486312338219-ce68d2c6f44d?w=1920&h=600&fit=crop')">
        <div class="container position-relative px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="page-heading">
                        <h1>My Posts</h1>
                        <span class="subheading" th:text="'Posts by ' + ${author.username}">Your Posts</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Main Content-->
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div th:if="${posts.isEmpty()}">
                    <p>You haven't created any posts yet. <a th:href="@{/blog/new}">Create your first post!</a></p>
                </div>
                
                <div th:each="post : ${posts}" class="post-preview">
                    <a th:href="@{/blog/post/{slug}(slug=${post.slug})}">
                        <h2 class="post-title" th:text="${post.title}">Post Title</h2>
                        <h3 class="post-subtitle" th:text="${post.subtitle}">Post Subtitle</h3>
                    </a>
                    <p class="post-meta">
                        <span th:if="${post.published}" class="badge bg-success">Published</span>
                        <span th:unless="${post.published}" class="badge bg-secondary">Draft</span>
                        Created on <span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}">Date</span>
                    </p>
                    <div class="mb-3">
                        <a th:href="@{/blog/edit/{id}(id=${post.id})}" class="btn btn-sm btn-primary">Edit</a>
                        <form th:action="@{/blog/delete/{id}(id=${post.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to delete this post?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </div>
                    <hr class="my-4" />
                </div>
            </div>
        </div>
    </div>
    <!-- Footer-->
    <footer class="border-top">
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="small text-center text-muted fst-italic">Copyright &copy; van den <strong style="display: inline-block; transform: scaleX(-1); font-weight: bold;">B</strong>oom - <span id="currentYear"></span></div>
                </div>
            </div>
        </div>
    </footer>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
