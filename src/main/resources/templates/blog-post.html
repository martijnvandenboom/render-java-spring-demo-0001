<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" th:content="${post.subtitle}" />
    <meta name="author" th:content="${post.author.username}" />
    <title th:text="${post.title} + ' - Clean Blog'">Blog Post</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800" rel="stylesheet" type="text/css" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body>
    <!-- Navigation-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!-- Page Header-->
    <header class="masthead" th:style="'background-image: url(' + ${post.headerImageUrl != null ? post.headerImageUrl : 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1920&h=600&fit=crop'} + ')'">
        <div class="container position-relative px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="post-heading">
                        <h1 th:text="${post.title}">Post Title</h1>
                        <h2 class="subheading" th:text="${post.subtitle}">Subtitle</h2>
                        <span class="meta">
                            Posted by <span th:text="${post.author.username}">Author</span>
                            on <span th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}">Date</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Post Content-->
    <article class="mb-4">
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div th:utext="${post.content}">Post content goes here</div>
                    
                    <!-- Edit/Delete buttons for author -->
                    <div class="mt-4" sec:authorize="isAuthenticated()" th:if="${#authentication.name == post.author.username}">
                        <hr />
                        <div class="d-flex gap-2">
                            <a th:href="@{/blog/edit/{id}(id=${post.id})}" class="btn btn-primary">Edit Post</a>
                            <form th:action="@{/blog/delete/{id}(id=${post.id})}" method="post" class="d-inline" 
                                  onsubmit="return confirm('Are you sure you want to delete this post?');">
                                <button type="submit" class="btn btn-danger">Delete Post</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </article>
    <!-- Footer-->
    <footer class="border-top">
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <ul class="list-inline text-center">
                        <li class="list-inline-item">
                            <a href="#!"><span class="fa-stack fa-lg">
                                <i class="fas fa-circle fa-stack-2x"></i>
                                <i class="fab fa-twitter fa-stack-1x fa-inverse"></i>
                            </span></a>
                        </li>
                    </ul>
                    <div class="small text-center text-muted fst-italic">Copyright &copy; van den <strong style="display: inline-block; font-weight: bold; animation: rotateB 2s linear infinite;">B</strong>oom - <span id="currentYear"></span></div>
                </div>
            </div>
        </div>
    </footer>
    <style>
        @keyframes rotateB {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
    </style>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
