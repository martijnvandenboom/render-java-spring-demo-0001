<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Edit Post - Clean Blog</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800" rel="stylesheet" type="text/css" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body>
    <!-- Navigation-->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!-- Page Header-->
    <header class="masthead" style="background-image: url('https://images.unsplash.com/photo-1455390582262-044cdead277a?w=1920&h=600&fit=crop')">
        <div class="container position-relative px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="page-heading">
                        <h1>Edit Post</h1>
                        <span class="subheading">Update your content</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Main Content-->
    <main class="mb-4">
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <form th:action="@{/blog/edit/{id}(id=${post.id})}" th:object="${post}" method="post">
                        <div class="form-floating mb-3">
                            <input class="form-control" id="title" type="text" th:value="${post.title}" 
                                   name="title" placeholder="Enter post title..." required />
                            <label for="title">Post Title</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="subtitle" type="text" th:value="${post.subtitle}" 
                                   name="subtitle" placeholder="Enter subtitle..." required />
                            <label for="subtitle">Subtitle</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="headerImageUrl" type="url" th:value="${post.headerImageUrl}" 
                                   name="headerImageUrl" placeholder="Enter header image URL (optional)" />
                            <label for="headerImageUrl">Header Image URL (optional)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" id="content" name="content"
                                      placeholder="Write your post content here..." 
                                      style="height: 300px" required th:text="${post.content}"></textarea>
                            <label for="content">Content</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="published" name="published" 
                                   th:checked="${post.published}" />
                            <label class="form-check-label" for="published">
                                Published
                            </label>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/blog/post/{slug}(slug=${post.slug})}" class="btn btn-secondary">Cancel</a>
                            <button class="btn btn-primary" type="submit">Update Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer-->
    <footer class="border-top">
        <div class="container px-4 px-lg-5">
            <div class="row gx-4 gx-lg-5 justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="small text-center text-muted fst-italic">Copyright &copy; Your Website 2024</div>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
