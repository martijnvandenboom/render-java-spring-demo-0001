# fly.toml app configuration file generated for Spring Boot WebAuthn app
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "render-java-spring-demo-0001"
primary_region = "ams" # Amsterdam - change to your preferred region (iad=US East, lhr=London, etc.)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running 24/7
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"  # Increased for Spring Boot startup
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"  # Simple health check endpoint

[env]
  SERVER_PORT = "8080"
  JAVA_OPTS = "-Xmx350m -Xms200m"
  SPRING_PROFILES_ACTIVE = "prod"

[[vm]]
  memory = '512mb'  # Free tier compatible
  cpu_kind = 'shared'
  cpus = 1

# Optional: Configure for multiple regions (uncomment when scaling)
# [[vm]]
#   memory = '512mb'
#   cpu_kind = 'shared'
#   cpus = 1
